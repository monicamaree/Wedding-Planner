<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hanami</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%27-14%20-14%2028%2028%27%3E%3Cg%20fill%3D%27%23F2C6CF%27%20stroke%3D%27%23D89AA8%27%20stroke-width%3D%27.5%27%3E%3Cellipse%20rx%3D%274.2%27%20ry%3D%276.5%27%20cy%3D%27-5.5%27/%3E%3Cellipse%20rx%3D%274.2%27%20ry%3D%276.5%27%20cy%3D%27-5.5%27%20transform%3D%27rotate%2872%29%27/%3E%3Cellipse%20rx%3D%274.2%27%20ry%3D%276.5%27%20cy%3D%27-5.5%27%20transform%3D%27rotate%28144%29%27/%3E%3Cellipse%20rx%3D%274.2%27%20ry%3D%276.5%27%20cy%3D%27-5.5%27%20transform%3D%27rotate%28216%29%27/%3E%3Cellipse%20rx%3D%274.2%27%20ry%3D%276.5%27%20cy%3D%27-5.5%27%20transform%3D%27rotate%28288%29%27/%3E%3C/g%3E%3Ccircle%20r%3D%272%27%20fill%3D%27%23C0758A%27/%3E%3C/svg%3E">
<style>
:root{--pink:#E8B8C1;--pinkd:#B5707A;--blush:#F4E2E4;--ivory:#FAF7F0;--paper:#FFFDF9;--sage:#A8B5A0;--green:#536B59;--mist:#B8C9D4;--lily:#91AEB7;--lav:#C8BED8;--ink:#393936;--grey:#66665F;--line:#E7E1D4;--bad:#9C3F39;--ok:#3F6B4A;--warn:#7E5A14;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--ink);font:15px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:.005em}
h1{font-size:2.1rem;line-height:1.15}h2{font-size:1.35rem}h3{font-size:1.1rem}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--paper);border-right:1px solid var(--line);padding:22px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px;font-family:var(--serif);font-size:1.6rem}
.nav{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:6px;cursor:pointer;color:var(--ink)}
.nav:hover{background:var(--blush)}
.nav[aria-current=page]{background:var(--blush);font-weight:600;box-shadow:inset 3px 0 0 var(--pinkd)}
.savestat{margin-top:0;padding:10px 12px;font-size:.8rem;color:var(--grey)}
.top{display:flex;gap:10px;align-items:center;padding:14px 32px;border-bottom:1px solid var(--line);background:var(--ivory);position:sticky;top:0;z-index:20}
.menu{display:none}
.searchbox{position:relative;flex:1;max-width:460px}
.searchbox input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.results{position:absolute;top:44px;left:0;right:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(57,57,54,.12);max-height:60vh;overflow:auto;z-index:30}
.results button{display:flex;width:100%;gap:10px;text-align:left;padding:9px 14px;border:0;background:none;cursor:pointer;align-items:baseline}
.results button:hover{background:var(--blush)}
.results small{color:var(--grey)}
main{padding:28px 32px 80px;max-width:1240px;width:100%}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph p{margin:6px 0 0;color:var(--grey)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:6px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:var(--blush);border-color:var(--pink)}
.btn.primary{background:var(--green);color:#FFFDF9;border-color:var(--green)}
.btn.primary:hover{background:#43584a}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.hero{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);padding:34px 34px 30px;margin-bottom:22px;background:radial-gradient(ellipse at 88% 15%,rgba(232,184,193,.6),transparent 55%),radial-gradient(ellipse at 62% 100%,rgba(184,201,212,.65),transparent 55%),radial-gradient(ellipse at 100% 85%,rgba(200,190,216,.5),transparent 50%),var(--paper)}
.hero svg.branch{position:absolute;right:0;top:0;height:100%;width:min(52%,520px);pointer-events:none}
.hero>*:not(svg){position:relative}
.hero h1{font-size:2.6rem;max-width:560px}
.hero .meta{margin:10px 0 18px;color:var(--ink);max-width:520px}
.stat{cursor:pointer;text-align:left;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;transition:border-color .15s,transform .15s}
.stat:hover{border-color:var(--pink)}
.stat .v{font-family:var(--serif);font-size:1.7rem;display:block}
.stat .l{font-weight:600;font-size:.88rem}
.stat .d{font-size:.8rem;color:var(--grey);display:block;margin-top:2px}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.78rem;border:1px solid var(--line);background:var(--ivory);white-space:nowrap}
.chip.ok{background:#E3EDE4;border-color:#BFD3C2;color:var(--ok)}
.chip.bad{background:#F6E1DE;border-color:#E3B8B3;color:var(--bad)}
.chip.warn{background:#F6EBD2;border-color:#E2CE9F;color:var(--warn)}
.chip.info{background:#E1EBF1;border-color:#BCD0DB;color:#35596B}
.chip.ex{background:#EDE8F4;border-color:#D4CCE3;color:#5B4A7A}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th{text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);color:var(--grey);font-size:.82rem;white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr[data-act]{cursor:pointer}
table.t tr[data-act]:hover td{background:var(--blush)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.muted{color:var(--grey)}
.small{font-size:.85rem}
.empty{border:1px dashed var(--sage);border-radius:10px;padding:28px;text-align:center;color:var(--grey);background:rgba(255,253,249,.6)}
.empty h3{color:var(--ink);margin-bottom:6px}
.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{background:none;border:0;padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--grey)}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--pinkd);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select,.f input,.f select,.f textarea{padding:8px 10px;border:1px solid #D6CFBF;border-radius:6px;background:#fff;width:100%}
.filters input,.filters select{width:auto;min-width:130px}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:.85rem;font-weight:600;margin-bottom:3px}
.chk{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.chk input{width:auto}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fgrid .wide{grid-column:1/-1}
.err{color:var(--bad);font-size:.88rem;min-height:1.2em}
.modalbg{position:fixed;inset:0;background:rgba(57,57,54,.38);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;z-index:60}
.modal{background:var(--paper);border-radius:12px;padding:24px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:900px}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.mf{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:90;display:flex;gap:14px;align-items:center;max-width:92vw}
.toast button{background:none;border:0;color:var(--pink);cursor:pointer;font-weight:600;text-decoration:underline}
.bar{height:12px;border-radius:6px;background:#EFE9DC;display:flex;overflow:hidden}
.bar>i{display:block;height:100%}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between}
.legend{display:grid;gap:5px;font-size:.88rem}
.legend button{display:flex;gap:8px;align-items:center;background:none;border:0;cursor:pointer;text-align:left;padding:2px 0;width:100%}
.dot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
.alert{display:flex;gap:10px;padding:9px 12px;border-radius:8px;margin-bottom:8px;font-size:.9rem;border:1px solid}
.alert.bad{background:#F6E1DE;border-color:#E3B8B3}.alert.warn{background:#F6EBD2;border-color:#E2CE9F}.alert.info{background:#E1EBF1;border-color:#BCD0DB}
.masonry{columns:220px;column-gap:12px}
.tile{break-inside:avoid;margin-bottom:12px;position:relative;border-radius:8px;overflow:hidden;background:var(--blush);cursor:pointer;border:1px solid var(--line)}
.tile img{display:block;width:100%}
.tile img.broken{min-height:120px}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(transparent,rgba(30,30,28,.62));color:#fff;font-size:.82rem}
.tile .fav{position:absolute;top:6px;right:8px;background:rgba(255,253,249,.9);border-radius:999px;padding:0 7px;font-size:.8rem}
.tile.drop{outline:3px solid var(--pinkd)}
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto}
.col{background:rgba(244,226,228,.45);border-radius:10px;padding:10px;min-height:160px}
.col h4{font-family:inherit;font-size:.9rem;margin-bottom:8px}
.col.over{background:rgba(232,184,193,.5)}
.kcard{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px;cursor:grab;font-size:.9rem}
.sw{display:flex;height:54px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.sw button{flex:1;border:0;cursor:pointer}
.floorwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--paper);max-height:620px}
.floor{position:relative;width:1000px;height:640px;transform-origin:0 0;background-image:linear-gradient(#EFE9DC 1px,transparent 1px),linear-gradient(90deg,#EFE9DC 1px,transparent 1px);background-size:20px 20px}
.tbl{position:absolute;border:2px solid var(--green);background:#E8EFE6;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.8rem;cursor:move;touch-action:none;user-select:none;line-height:1.2}
.tbl.round{border-radius:50%}
.tbl.obj{border:2px dashed var(--lily);background:#E4ECF0}
.tbl.sel{box-shadow:0 0 0 3px var(--pinkd)}
.tbl.hit{background:#FBE4A8}
.tbl.over{border-color:var(--bad);background:#F6E1DE}
.tbl.drop{box-shadow:0 0 0 3px var(--pink)}
.gchip{display:inline-block;padding:3px 10px;margin:0 6px 6px 0;border:1px solid var(--line);background:var(--paper);border-radius:999px;font-size:.85rem;cursor:grab}
.tl{border-left:2px solid var(--pink);margin-left:6px;padding-left:18px}
.tl .it{position:relative;padding:0 0 18px}
.tl .it:before{content:"";position:absolute;left:-25px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--pinkd)}
.tl .it.conf:before{border-color:var(--bad);background:var(--bad)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
details summary{cursor:pointer;font-weight:600}

body{background:var(--ivory)}

translate%28216%2C156%29%20scale%28.8%29%27/%3E%3Cuse%20xlink%3Ahref%3D%27%23b%27%20transform%3D%27translate%28140%2C194%29%20scale%281%29%27/%3E%3Cuse%20xlink%3Ahref%3D%27%23b%27%20transform%3D%27translate%28330%2C70%29%20scale%28.7%29%27/%3E%3Cuse%20xlink%3Ahref%3D%27%23b%27%20transform%3D%27translate%2880%2C226%29%20scale%28.8%29%27/%3E%3Ccircle%20cx%3D%27380%27%20cy%3D%2796%27%20r%3D%274%27%20fill%3D%27%23E8B8C1%27/%3E%3Ccircle%20cx%3D%27262%27%20cy%3D%27176%27%20r%3D%273.5%27%20fill%3D%27%23F2C6CF%27/%3E%3Ccircle%20cx%3D%27320%27%20cy%3D%2730%27%20r%3D%273%27%20fill%3D%27%23F2C6CF%27/%3E%3C/svg%3E") no-repeat top right/contain;opacity:.5;pointer-events:none}

.card,.stat{background:rgba(255,253,249,.93);box-shadow:0 10px 28px rgba(127,163,184,.12)}
.card:hover,.stat:hover{border-color:#E7BFC9}
.btn:hover{background:rgba(232,184,193,.28);border-color:var(--lilypink)}
.btn.primary{background:var(--pond);border-color:var(--pond)}
.btn.primary:hover{background:#375349}
.ph h1{color:#3B4D45}
.ph h1::after{content:"";display:block;width:92px;height:14px;margin-top:8px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%27-14%20-14%2028%2028%27%3E%3Cg%20fill%3D%27%23F2C6CF%27%20stroke%3D%27%23D89AA8%27%20stroke-width%3D%27.5%27%3E%3Cellipse%20rx%3D%274.2%27%20ry%3D%276.5%27%20cy%3D%27-5.5%27/%3E%3Cellipse%20rx%3D%274.2%27%20ry%3D%276.5%27%20cy%3D%27-5.5%27%20transform%3D%27rotate%2872%29%27/%3E%3Cellipse%20rx%3D%274.2%27%20ry%3D%276.5%27%20cy%3D%27-5.5%27%20transform%3D%27rotate%28144%29%27/%3E%3Cellipse%20rx%3D%274.2%27%20ry%3D%276.5%27%20cy%3D%27-5.5%27%20transform%3D%27rotate%28216%29%27/%3E%3Cellipse%20rx%3D%274.2%27%20ry%3D%276.5%27%20cy%3D%27-5.5%27%20transform%3D%27rotate%28288%29%27/%3E%3C/g%3E%3Ccircle%20r%3D%272%27%20fill%3D%27%23C0758A%27/%3E%3C/svg%3E") 0 50%/14px 14px no-repeat,linear-gradient(90deg,transparent 18px,#E4C3CB 18px,#B8C9D4 100%) 0 50%/92px 1.5px no-repeat}

function buildSeed(S,H){
 const R={tasks:0,subs:0,decisions:0,expenses:0,cats:0,suppliers:0,venues:0,notes:0,boards:0,supTasks:0,docTasks:0,skipped:0,cyc:0,unresolved:[],areas:{}},uid=H.uid;

 // boards

 // suppliers

 // expenses
 const expId={};for(const [k,name,cat,sup] of SEED_EXP){let e=S.expenses.find(x=>x.sk===k)||S.expenses.find(x=>nrm(x.name)===nrm(name));if(!e){e={id:uid(),sk:k,ph:true,tbd:true,created:Date.now(),name,cat:catId(cat),supplier:sup&&supId[sup]||'',est:0,quote:0,contract:0,actual:0,status:'Researching',notes:'Placeholder: no amount entered yet. Review whether this applies before spending.',payments:[]};S.expenses.push(e);R.expenses++}expId[k]=e.id}
 // venues
 for(const [name,loc,notes,cap] of SEED_VEN){const key=nrm(name).split(' ')[0];if(!S.venues.some(v=>nrm(v.name).includes(key))){S.venues.push({id:uid(),sk:'ven-'+key,created:Date.now(),name,location:loc,vtype:'Private estate',use:'Both',capacity:cap||null,status:'Shortlisted',hire:0,minspend:0,extras:[],wet:false,marquee:false,byo:false,notes,scores:{}});R.venues++}}
 // decisions
 const decId={};let ord=0;
 for(const d of SEED_DEC){const [k,title,q,why,opts,needs,cost,dep]=d;let r=S.decisions.find(x=>x.sk===k)||S.decisions.find(x=>nrm(x.title)===nrm(title));
  if(!r){r={id:uid(),sk:k,created:Date.now(),title,status:'To consider',date:'',question:q,why,options:opts.split(' | ').map(o=>'• '+o).join('\n'),needs,cost,dependents:dep,owner:'',final:'',notes:'',ord:ord,seedTasks:d[8]||''};S.decisions.push(r);R.decisions++}
  decId[k]=r.id;ord++}
 // notes
 for(const [k,title,body] of SEED_NOTES){if(!S.notes.some(n=>n.sk===k)&&!S.notes.some(n=>nrm(n.title)===nrm(title))){S.notes.push({id:uid(),sk:k,created:Date.now(),title,body,tags:['Framework']});R.notes++}}
 // tasks
 const blocks=SEED_BLOCKS.map(b=>b.slice());
 const opt=blocks.find(b=>b[0]==='Optional ideas');opt[2]=OPTIONAL.map((t,i)=>['o'+i,'Consider: '+t,'L','o',[],'Optional. Decide whether this suits you. Not a required task.','','12']);
 const keyId={};const pending=[];let rank=0;
 S.tasks.forEach(t=>{if(t.sk)keyId[t.sk]=t.id});
 for(const [area,defStage,list] of blocks)for(const t of list){
  const [key,title,pri,tags,subs,desc,deps,stg,rel]=t;rank++;
  let r=S.tasks.find(x=>x.sk===key);
  if(!r){const dup=S.tasks.find(x=>nrm(x.title)===nrm(title));if(dup){R.skipped++;keyId[key]=dup.id;continue}
   const parts=(desc||'').split(' Q: ');
   r={id:uid(),sk:key,seed:true,created:Date.now(),rank,title,area,cat:STAGES[stg!==undefined&&stg!==''?+stg:defStage],priority:PRI[pri],status:'Not started',due:'',assignee:'',desc:parts[0],notes:parts[1]?'Question: '+parts[1]:'',tags:(tags||'').split('').map(c=>TG[c]),deps:[],subs:(subs||[]).map(s=>({t:s,done:false})),rel:[]};
   S.tasks.push(r);R.tasks++;R.subs+=r.subs.length;R.areas[area]=(R.areas[area]||0)+1;
   if(r.tags.includes('Supplier research'))R.supTasks++;if(r.tags.includes('Documents'))R.docTasks++;
   pending.push([r,deps,rel])}
  keyId[key]=r.id}
 for(const [r,deps,rel] of pending){
  (deps||'').split(',').filter(Boolean).forEach(k=>{if(keyId[k])r.deps.push(keyId[k]);else R.unresolved.push(r.sk+'->'+k)});
  (rel||'').split(',').filter(Boolean).forEach(x=>{const [t,k]=x.split(':');let o=null;
   if(t==='e'&&expId[k])o={t:'expense',id:expId[k]};else if(t==='s'&&supId[k])o={t:'supplier',id:supId[k]};else if(t==='b'&&boardId[k])o={t:'board',id:boardId[k]};else if(t==='d'&&decId[k])o={t:'decision',id:decId[k]};else if(t==='p')o={t:'page',k};
   if(o)r.rel.push(o);else R.unresolved.push(r.sk+'~'+x)})}
 // link decisions to their tasks

 // cycle check
 const byId={};S.tasks.forEach(t=>byId[t.id]=t);
 const state={};const visit=(id,path)=>{if(state[id]===2)return;if(state[id]===1){return true}state[id]=1;const t=byId[id];for(const d of (t.deps||[]).slice()){if(!byId[d])continue;if(state[d]===1){t.deps=t.deps.filter(x=>x!==d);R.cyc++;continue}visit(d)}state[id]=2};
 S.tasks.forEach(t=>visit(t.id));
 return R;
}

/* ============ calculations (integer cents) ============ */
const live=e=>e.status!=='Cancelled';
const basis=e=>e.actual||e.contract||e.quote||e.est||0;
const paidOf=e=>sum(e.payments||[],p=>p.paid?p.amt:0);
const owedOf=e=>(e.actual||e.contract)?Math.max(0,(e.actual||e.contract)-paidOf(e)):0;
function payState(e){const p=paidOf(e),b=basis(e);if(!p)return 'Unpaid';return b>0&&p>=b?'Paid in full':'Part paid'}
function nextDue(e){const d=(e.payments||[]).filter(p=>!p.paid&&p.due).map(p=>p.due).sort();return d[0]||''}
function stats(){
 const ex=S.expenses.filter(live),o={};
 o.budget=S.settings.budget;o.est=sum(ex,e=>e.est);o.quote=sum(ex,e=>e.quote);o.contract=sum(ex,e=>e.contract);o.actual=sum(ex,e=>e.actual);
 o.forecast=sum(ex,basis);o.paid=sum(S.expenses,paidOf);
 o.committed=sum(ex.filter(e=>e.contract||e.actual),owedOf);
 o.remaining=o.budget-o.forecast;
 o.alloc=sum(S.cats.filter(c=>!c.arch),c=>c.alloc);o.unalloc=o.budget-o.alloc;
 const cc=S.cats.find(c=>c.name==='Contingency');
 o.contSet=cc?cc.alloc:0;o.cont=cc?cc.alloc-sum(ex.filter(e=>e.cat===cc.id),basis):0;
 o.perGuest=S.settings.guests?Math.round(o.forecast/S.settings.guests):0;
 return o;
}
function catStats(c){const all=S.expenses.filter(e=>e.cat===c.id),ex=all.filter(live);return{forecast:sum(ex,basis),paid:sum(all,paidOf),n:all.length}}
const catName=id=>(S.cats.find(c=>c.id===id)||{name:'Uncategorised'}).name;
const supName=id=>(S.suppliers.find(c=>c.id===id)||{}).name||'';
function allPayments(){const out=[];S.expenses.filter(live).forEach(e=>(e.payments||[]).forEach(p=>out.push({...p,exp:e})));return out}
function paymentChip(p){if(p.paid)return chip('✓ Paid','ok');if(p.due&&p.due<today())return chip('⚠ Overdue','bad');return chip('◷ Due','info')}
function alerts(){

 S.cats.filter(c=>!c.arch&&c.alloc>0).forEach(c=>{const cs=catStats(c);if(cs.forecast>c.alloc)a.push({l:'warn',t:`${c.name} is ${fmt(cs.forecast-c.alloc)} over its allocation.`})});
 allPayments().filter(p=>!p.paid&&p.due&&p.due<today()).forEach(p=>a.push({l:'bad',t:`Overdue: ${p.label||'Payment'} for ${p.exp.name} (${fmt(p.amt)}, due ${fdate(p.due)}).`}));
 allPayments().filter(p=>!p.paid&&p.due&&p.due>=today()&&p.due<=addDays(s.dueDays||7)).forEach(p=>a.push({l:'warn',t:`Due soon: ${p.label||'Payment'} for ${p.exp.name} (${fmt(p.amt)}, ${fdate(p.due)}).`}));
 S.expenses.filter(live).forEach(e=>{if(e.est&&e.quote&&e.quote>e.est*(1+(s.quoteAlertPct||20)/100))a.push({l:'info',t:`${e.name}: quote is ${fmt(e.quote-e.est)} above your estimate.`});
  const p=paidOf(e),b=basis(e);if(b&&p>b)a.push({l:'bad',t:`${e.name}: payments recorded (${fmt(p)}) exceed the cost (${fmt(b)}). Check for a duplicate.`})});

 return a;
}

async function saveForm(){
 const {ent,id,preset}=FORM,E=ENT[ent],out={},errs=[];
 for(const f of E.fields){const el=$('#f_'+f.k);if(!el)continue;let v;
  if(f.t==='checkbox')v=el.checked;
  else if(f.t==='money'){v=toC(el.value);if(el.value.trim()&&isNaN(parseFloat(el.value)))errs.push(f.l+' must be a number');if(v<0)errs.push(f.l+' cannot be negative')}
  else if(f.t==='number'){v=el.value===''?null:parseInt(el.value,10);if(v!==null&&v<0)errs.push(f.l+' cannot be negative')}
  else if(f.t==='lines')v=parseLines(el.value);
  else if(f.t==='multi')v=[...el.selectedOptions].map(o=>o.value);
  else if(f.t==='tags')v=el.value.split(',').map(s=>s.trim()).filter(Boolean);
  else v=el.value.trim();
  if(f.req&&(v===''||v===null||v===0&&f.t==='money'))errs.push(f.l+' is required');
  if(f.t==='url'&&v&&!/^https?:\/\//i.test(v))errs.push(f.l+' must start with http:// or https://');
  out[f.k]=v}
 if(ent==='settings'&&out.max&&out.min&&out.max<out.min)errs.push('Maximum budget must be at least the minimum');
 if(ent==='task'&&id&&wouldCycle(id,out.deps||[]))errs.push('Those dependencies would create a loop');
 if(errs.length){$('#ferr').textContent=errs.join('. ')+'.';return}
 const btn=$('#fsave');btn.disabled=true;let ok=true,msg='Saved';
 if(ent==='payment'){
  const e=S.expenses.find(x=>x.id===out.exp);e.payments=e.payments||[];
  if(e.payments.some(p=>p.amt===out.amt&&p.due===out.due&&(p.label||'')===out.label)){$('#ferr').textContent='A payment with the same label, amount and date already exists on this expense.';btn.disabled=false;return}
  e.payments.push({id:uid(),label:out.label,amt:out.amt,due:out.due,paid:out.paid});ok=await commit('expenses');msg='Payment added'}
 else if(ent==='settings'){Object.assign(S.settings,out,{onboarded:true});ok=await commit('settings')}
 else{
  if(ent==='guest'&&!id){const nm=(out.first+' '+out.last).trim().toLowerCase();if(S.guests.some(g=>(g.first+' '+(g.last||'')).trim().toLowerCase()===nm)&&!FORM.dupOk){FORM.dupOk=1;$('#ferr').textContent='A guest with this name already exists. Select Add guest again if this is a different person.';btn.disabled=false;return}}
  let r;if(id){r=S[E.coll].find(x=>x.id===id);Object.assign(r,out);r.upd=Date.now();msg='Changes saved'}
  else{r={id:uid(),created:Date.now(),...(E.defaults?E.defaults():{}),...out,...(preset||{})};
   if(ent==='task'){r.status=r.status||'Not started'}
   S[E.coll].push(r);msg=E.label+' added'}
  if(ent==='expense'&&(out.est||out.quote||out.contract||out.actual)){const x=id?S.expenses.find(q=>q.id===id):S.expenses[S.expenses.length-1];if(x)x.tbd=false}
  ok=await commit(E.coll)}
 if(!ok){btn.disabled=false;toast('Couldn\'t save. Your change is on screen but not stored. Try again.');return}
 closeModal();render();toast(msg);if(ent==='settings'&&!S.settings.fw)offerFramework();
}

function parseCSV(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';rows.push(r);r=[]}else c+=ch}if(c||r.length){r.push(c);rows.push(r)}return rows.filter(r=>r.some(x=>x.trim()))}
function readImg(file,max=720){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=()=>rej(new Error('not an image'));im.src=fr.result};fr.onerror=()=>rej(new Error('unreadable'));fr.readAsDataURL(file)})}

function pdfClean(t){return String(t??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/•/g,'-').replace(/[^\x20-\x7E]/g,'')}

function wrapText(t,w){const out=[];for(const para of String(t).split('\n')){let line='';for(const word of para.split(/\s+/).filter(Boolean)){const w2=word.length>w?word.slice(0,w):word;if((line+' '+w2).trim().length>w){out.push(line);line=w2}else line=(line+' '+w2).trim()}out.push(line)}return out}
function makePDF(items,title){
 const pages=[];let cur=[],y=792;const np=()=>{pages.push(cur);cur=[];y=792};
 const put=(txt,size,font,x,lh)=>{if(y-lh<58)np();cur.push('BT /'+font+' '+size+' Tf '+x+' '+(y-size)+' Td ('+pdfEsc(txt)+') Tj ET');y-=lh};
 for(const it of items){const t=pdfClean(it.t);
  if(it.s==='h1')wrapText(t,46).forEach(l=>put(l,20,'F2',50,26));
  else if(it.s==='h2'){if(y<120)np();y-=8;wrapText(t,70).forEach(l=>put(l,13,'F2',50,18))}
  else if(it.s==='h3'){if(y<90)np();y-=3;wrapText(t,84).forEach(l=>put(l,10.5,'F2',50,15))}
  else if(it.s==='b')wrapText(t,88).forEach((l,i)=>put((i?'':'- ')+l,9.5,'F1',i?62:52,13));
  else wrapText(t,96).forEach(l=>put(l,9.5,'F1',50,13))}
 pages.push(cur);
 const objs=[];objs[1]='<< /Type /Catalog /Pages 2 0 R >>';objs[2]='<< /Type /Pages /Kids ['+pages.map((_,i)=>(5+2*i)+' 0 R').join(' ')+'] /Count '+pages.length+' >>';
 objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
 const ft=pdfEsc(pdfClean(title));
 pages.forEach((p,i)=>{const st=p.join('\n')+'\nBT /F1 8 Tf 50 30 Td ('+ft+' - page '+(i+1)+' of '+pages.length+') Tj ET';objs[5+2*i]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+2*i)+' 0 R >>';objs[6+2*i]='<< /Length '+st.length+' >>\nstream\n'+st+'\nendstream'});
 let out='%PDF-1.4\n';const off=[];for(let i=1;i<objs.length;i++){off[i]=out.length;out+=i+' 0 obj\n'+objs[i]+'\nendobj\n'}
 const xr=out.length;out+='xref\n0 '+objs.length+'\n0000000000 65535 f \n'+off.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
 return out;
}

function filteredExpenses(){

  if(f.mode==='contracted'&&!(e.contract&&live(e)))return false;

}

let LOCKREC=null,UNLOCKED=false,lastAct=Date.now(),lockTries=0;
const hasCrypto=()=>typeof crypto!=='undefined'&&crypto.subtle&&typeof TextEncoder!=='undefined';
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const ub64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function hashPw(pw,salt,iter){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},k,256))}
async function makeLock(pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iter=200000;return{v:1,salt:b64(salt),iter,hash:await hashPw(pw,salt,iter)}}
async function checkPw(pw){if(!LOCKREC)return false;const h=await hashPw(pw,ub64(LOCKREC.salt),LOCKREC.iter);let d=h.length^LOCKREC.hash.length;for(let i=0;i<h.length;i++)d|=h.charCodeAt(i)^(LOCKREC.hash.charCodeAt(i)||0);return d===0}

 const brand='<div class="lb"><svg width="34" height="34"><use href="#bl"/></svg><span>Hanami</span></div>';

 L.innerHTML=mode==='setup'?`<div class="lockcard" role="dialog" aria-modal="true" aria-labelledby="lt">${brand}<h1 id="lt">Protect your wedding plan</h1><p class="small muted">Choose a password. You’ll enter it each time you open Hanami, and Hanami locks itself after 15 minutes of inactivity. If you forget it, the only way back in is to erase everything, so keep it somewhere safe and export a backup from Settings now and then.</p><label class="f"><span>Password (at least 8 characters)</span><input id="lpw" type="password" autocomplete="new-password"></label><label class="f"><span>Confirm password</span><input id="lpw2" type="password" autocomplete="new-password"></label>${show}<div class="err" id="lerr" role="alert"></div><button class="btn primary" style="width:100%" data-act="lockSubmit" id="lbtn">Set password</button></div>`
 :mode==='forgot'?`<div class="lockcard" role="dialog" aria-modal="true" aria-labelledby="lt">${brand}<h1 id="lt">Forgot your password?</h1><p class="small">There is no way to recover it. You can erase everything in Hanami (all tasks, budget, guests, boards and the password) and start again. This can’t be undone.</p><label class="f"><span>Type DELETE to confirm</span><input id="ldel" autocomplete="off"></label><div class="err" id="lerr" role="alert"></div><div class="acts"><button class="btn" data-act="lockBack">Back</button><button class="btn danger" data-act="lockErase">Erase everything</button></div></div>`
 :`<div class="lockcard" role="dialog" aria-modal="true" aria-labelledby="lt">${brand}<h1 id="lt">Welcome back</h1><p class="small muted">Enter your password to open Hanami.</p><label class="f"><span>Password</span><input id="lpw" type="password" autocomplete="current-password"></label>${show}<div class="err" id="lerr" role="alert"></div><button class="btn primary" style="width:100%" data-act="lockSubmit" id="lbtn">Unlock</button><p style="text-align:center;margin:14px 0 0"><a href="#" class="small" data-act="lockForgot">Forgot password?</a></p></div>`;

document.addEventListener('change',async e=>{
 const el=e.target,k=el.dataset.chg;if(!k)return;const v=el.value;
 switch(k){
  case 'bfcat':U.bf.cat=v;break;case 'bfstatus':U.bf.status=v;break;case 'bfmode':U.bf.mode=v;break;
  case 'sf':case 'tf':case 'tc':case 'ta':case 'tp':case 'tt':case 'tg':case 'df':case 'gf':case 'bfilter':U[k]=v;break;
  case 'lockShow':{['lpw','lpw2'].forEach(i=>{const n=$('#'+i);if(n)n.type=el.checked?'text':'password'});return}
  case 'restoreFile':{const f=el.files[0];if(!f)return;let d;try{const j=JSON.parse(await f.text());d=j&&j.data?j.data:j}catch(e){toast('That file couldn’t be read as a Hanami backup');return}
   if(!d||typeof d!=='object'||!d.settings||!Array.isArray(d.tasks||[])){toast('That doesn’t look like a Hanami backup');return}el.value='';
   ask('Replace everything in Hanami with this backup? It has '+(d.tasks||[]).length+' tasks, '+(d.expenses||[]).length+' expenses, '+(d.guests||[]).length+' guests and '+(d.decisions||[]).length+' decisions. Your current data will be replaced, so save a copy of it first if you need it.',()=>applyRestore(d));return}
  case 'subDone':{const t=S.tasks.find(x=>x.id===el.dataset.id);t.subs[+el.dataset.i].done=el.checked;await commit('tasks');break}
  case 'wShow':{const h=S.ui.hidden;const i=h.indexOf(el.dataset.k);if(el.checked&&i>=0)h.splice(i,1);if(!el.checked&&i<0)h.push(el.dataset.k);await commit('ui');break}
  case 'score':{const vn=S.venues.find(x=>x.id===el.dataset.id);vn.scores=vn.scores||{};vn.scores[el.dataset.c]=v;await commit('venues');break}
  case 'crit':{S.ui.crit.find(c=>c.id===el.dataset.id).on=el.checked;await commit('ui');break}
  case 'doneTask':{const t=S.tasks.find(x=>x.id===el.dataset.id);t.status=el.checked?'Completed':'Not started';t.done=el.checked?today():'';await commit('tasks');break}
  case 'rsvp':{const g=S.guests.find(x=>x.id===el.dataset.id);g[el.dataset.k]=v;await commit('guests');break}
  case 'seat':{if(!v)return;const g=S.guests.find(x=>x.id===v);g.table=el.dataset.id;await commit('guests');break}
  case 'palColor':case 'palHex':{const p=S.palettes.find(x=>x.id===el.dataset.id);if(k==='palHex'&&!/^#[0-9a-f]{6}$/i.test(v)){toast('Enter a hex code like #E8B8C1');break}p.colors[+el.dataset.i]=v.toUpperCase();await commit('palettes');break}
  case 'imgField':{const f=el.files[0];if(!f)return;try{const d=await readImg(f,640);$('#f_'+el.dataset.k).value=d;$('#prev_'+el.dataset.k).innerHTML=`<img src="${d}" alt="" style="max-height:90px;border-radius:6px">`}catch(err){toast('That file couldn’t be read as an image')}return}
  case 'gfile':{const f=el.files[0];if(!f)return;const rows=parseCSV(await f.text());if(rows.length<2){toast('That CSV has no guest rows');return}
   const h=rows[0].map(x=>x.trim().toLowerCase()),ix=(...n)=>h.findIndex(x=>n.includes(x));const c={f:ix('first','first name'),l:ix('last','last name'),g:ix('group','household'),d:ix('diet','dietary'),e:ix('email')};
   if(c.f<0){toast('CSV needs a “first” column');return}let add=0,dup=0;

    S.guests.push({id:uid(),first,last,group:c.g>=0?r[c.g]:'',rel:'',invite:'To be invited',ceremony:'Pending',reception:'Pending',diet:c.d>=0?r[c.d]:'',email:c.e>=0?r[c.e]:'',plus1:false});add++});
   const ok=await commit('guests');el.value='';render();toast(`${add} guest${add===1?'':'s'} imported${dup?`, ${dup} duplicate${dup===1?'':'s'} skipped`:''}${ok?'':' (not saved)'}`);return}
 }
 render();

let dragData=null;

document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('[data-drop]');if(d&&dragData){e.preventDefault();d.classList.add(d.dataset.drop==='item'?'drop':d.dataset.drop==='col'?'over':'drop')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('[data-drop]');if(d)d.classList.remove('drop','over')});
document.addEventListener('drop',async e=>{
 const d=e.target.closest&&e.target.closest('[data-drop]');if(!d||!dragData)return;e.preventDefault();d.classList.remove('drop','over');
 const [t,id]=dragData.split(':');dragData=null;const kind=d.dataset.drop;
 if(t==='task'&&kind==='col'){const x=S.tasks.find(q=>q.id===id);x.status=d.dataset.id;await commit('tasks');render()}
 else if(t==='item'&&kind==='item'&&id!==d.dataset.id){const i=S.items.findIndex(q=>q.id===id),[it]=S.items.splice(i,1),j=S.items.findIndex(q=>q.id===d.dataset.id);S.items.splice(j,0,it);await commit('items');render()}
 else if(t==='guest'&&kind==='table'){const tb=S.tables.find(q=>q.id===d.dataset.id);if(!tb||!(tb.cap>0)){toast('That object has no seats');return}const g=S.guests.find(q=>q.id===id);g.table=tb.id;await commit('guests');U.tsel=tb.id;render();if(seatCount(tb)>tb.cap)toast(`${tb.name} is over capacity`)}
});
document.addEventListener('dragend',()=>{dragData=null;document.querySelectorAll('.drop,.over').forEach(n=>n.classList.remove('drop','over'))});

let TD=null;
document.addEventListener('pointerdown',e=>{
 const el=e.target.closest&&e.target.closest('.tbl[data-tid]');if(!el)return;
 const t=S.tables.find(x=>x.id===el.dataset.tid);TD={el,t,sx:e.clientX,sy:e.clientY,ox:t.x,oy:t.y,moved:false};
});
window.addEventListener('pointermove',e=>{
 if(!TD)return;const dx=(e.clientX-TD.sx)/U.zoom,dy=(e.clientY-TD.sy)/U.zoom;
 if(!TD.moved&&Math.abs(dx)+Math.abs(dy)<4)return;TD.moved=true;
 TD.t.x=Math.max(0,Math.min(1000-TD.t.w,Math.round((TD.ox+dx)/10)*10));TD.t.y=Math.max(0,Math.min(640-TD.t.h,Math.round((TD.oy+dy)/10)*10));
 TD.el.style.left=TD.t.x+'px';TD.el.style.top=TD.t.y+'px';
});
window.addEventListener('pointerup',async()=>{
 if(!TD)return;const{t,moved}=TD;TD=null;U.tsel=t.id;if(moved)await commit('tables');render();
});

 S.suppliers.forEach(x=>add('Supplier',x.name,x.category,'supplier',x.id));S.notes.forEach(x=>add('Note',x.title,x.body||'','note',x.id));
 S.decisions.forEach(x=>add('Decision',x.title,x.status,'decision',x.id));S.runsheet.forEach(x=>add('Schedule',x.activity,x.start,'run',x.id));
 S.items.forEach(x=>add('Image',x.note||'Image',(x.tags||[]).join(' ')+' '+(S.boards.find(b=>b.id===x.board)||{}).name,'item',x.id));S.links.forEach(x=>add('Link',x.title,x.url,'link',x.id));

A.sres=el=>{const{ent,id}=el.dataset;$('#results').hidden=true;$('#gs').value='';
